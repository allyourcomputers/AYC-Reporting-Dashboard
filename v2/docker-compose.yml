version: '3.8'

services:
  halo-reporting-v2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # These are required at build time for Vite
        VITE_CONVEX_URL: ${VITE_CONVEX_URL}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    container_name: halo-reporting-v2
    restart: unless-stopped
    ports:
      - "${PORT:-3200}:80"
    networks:
      - halo-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  halo-network:
    driver: bridge
